    --pink: #F2798B;

    --pink-soft: #FFE9EC;
    --pink-softer: #FFF5F6;
    --ink: #3A2430;
    --ink-soft: #7A5C66;
    --cream: #FFFCFA;
    --white: #FFFFFF;
    --shadow: 0 10px 24px rgba(226, 83, 107, 0.18);
    --shadow-sm: 0 4px 10px rgba(226, 83, 107, 0.14);
  }

    font-family: 'Parkinsans', 'Segoe UI', system-ui, sans-serif;
    color: var(--ink);
    overflow-x:hidden;
  }

  .app{
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 32px 20px 56px;
  }

  .logo{
    width: min(340px, 62vw);
    height:auto;
    margin-top: 8px;
    margin-bottom: 6px;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.12));
    animation: dropIn 0.7s cubic-bezier(.22,1.4,.36,1) both;
  }

  @keyframes dropIn{
    from{ transform: translateY(-14px) scale(0.94); opacity:0; }
    to{ transform: translateY(0) scale(1); opacity:1; }
  }

  h1{
    font-size: clamp(22px, 4.4vw, 34px);
    font-weight: 600;
    text-align:center;
    margin: 6px 0 4px;
    letter-spacing: 0.2px;
    color: var(--white);
  }

  .sub{
    color: var(--white);
    font-size: clamp(13px, 2.4vw, 16px);
    text-align:center;
    margin: 0 0 30px;
    font-weight: 600;
    opacity: 0.85;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(3, minmax(150px, 200px));
    gap: 18px;
    width: 100%;
    max-width: 720px;
  }

  @media (max-width: 620px){
    .grid{ grid-template-columns: repeat(2, minmax(130px, 1fr)); max-width: 460px; }
  }

  .card{
    position: relative;
    background: var(--white);
    border: 3px solid var(--pink-soft);
    border-radius: 22px;
    padding: 20px 12px 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 10px;
    cursor:pointer;
    box-shadow: var(--shadow-sm);
    transition: transform .18s cubic-bezier(.2,1.4,.4,1), box-shadow .18s ease, border-color .18s ease;
    min-height: 132px;
    -webkit-tap-highlight-color: transparent;
  }

  .card:hover{
    transform: translateY(-4px) scale(1.03);
    border-color: var(--pink);
    box-shadow: var(--shadow);
  }

  .card:active, .card.selected{
    transform: scale(0.96);
  }

  .card.selected{
    border-color: var(--pink);
    background: var(--pink-softer);
  }

  .icon{
    width: 52px;
    height: 52px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon svg, .icon img{ width:100%; height:100%; display:block; }

  .label{
    font-size: 14px;
    font-weight: 600;
    text-align:center;
    line-height: 1.2;
  }

  .card.smell .label{ font-size: 12.5px; }

  footer.note{
    margin-top: 34px;
    font-size: 12px;
    color: var(--white);
    text-align:center;
    opacity:0.75;
    font-weight: 600;
  }

  /* thank-you overlay */
  .overlay{
    position: fixed;
    inset:0;
    z-index: 10;
    background: linear-gradient(160deg, var(--pink) 0%, var(--pink-deep) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color: var(--white);
    padding: 24px;
    opacity:0;
    pointer-events:none;
    transition: opacity .35s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }

  .overlay .check{
    width: 92px;
    height: 92px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom: 18px;
    animation: pop .5s cubic-bezier(.22,1.6,.36,1) both;
  }
  @keyframes pop{ from{ transform: scale(0); } to{ transform: scale(1); } }

  .overlay h2{
    font-size: clamp(24px, 5vw, 36px);
    font-weight: 600;
    margin: 0 0 8px;
  }
  .overlay p{
    font-size: 15px;
    font-weight: 600;
    opacity: 0.9;
    margin: 0;
  }

  .config-warning{
    position: fixed;
    bottom: 12px;
    left: 12px;
    right: 12px;
    max-width: 640px;

      <svg width="46" height="46" viewBox="0 0 24 24" fill="none">

  <div class="config-warning" id="configWarning">
    Heads up: this app isn't connected to a Google Sheet yet. Answers are only logged in the browser console right now — see the setup notes below the app.
  </div>

<script>
  // ---- Google Sheets connection -------------------------------------
  // Paste the URL of your deployed Google Apps Script Web App here.
  // See the setup instructions provided alongside this file.
  const SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxs3t31gwdaD2_2J76TO_ZKtxT5abe7SuRW5yYwW7hvTyEk0ZRl81OBuAGPKOhp8l7b/exec";

  const isConfigured = !SHEET_WEBHOOK_URL.includes("PASTE_YOUR");
  if (!isConfigured) {
    document.getElementById('configWarning').style.display = 'block';
  }

  async function recordAnswer(option){
    const payload = {
      option: option,
      timestamp: new Date().toISOString()
    };

    if (!isConfigured){
      console.log('[Sneaky Surprise survey] answer captured (not sent — no Sheet connected yet):', payload);
      return;
    }

    try{
      await fetch(SHEET_WEBHOOK_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
    }catch(err){
      console.error('Could not reach the Google Sheet:', err);
    }
  }

  const cards = document.querySelectorAll('.card');
  const overlay = document.getElementById('overlay');
  const overlayChoice = document.getElementById('overlayChoice');

  cards.forEach(card => {
    card.addEventListener('click', () => {
      cards.forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');

      const option = card.dataset.option;
      recordAnswer(option);

      overlayChoice.textContent = "You picked: " + option;
      overlay.classList.add('show');

      setTimeout(() => {
        overlay.classList.remove('show');
        card.classList.remove('selected');
      }, 2200);
    });
  });
</script>
